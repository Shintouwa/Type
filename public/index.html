<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blind Typing Test</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body oncontextmenu="return false;">

    <div class="container fade-in" id="welcome-screen">
        <h1>Welcome to the Blind Typing Test</h1>
        <p>Enter your details to join.</p>
        <div class="auth-box" style="margin: 0 auto;">
            <input type="text" id="participant-name" placeholder="Full Name" required>
            <button onclick="joinTest()">Join Waiting Room</button>
        </div>
    </div>

    <div class="container fade-in test-screen" id="waiting-screen" style="display: none;">
        <h2>Waiting for Admin to Start...</h2>
        <div class="loader"></div> 
    </div>

    <div class="container fade-in test-screen" id="active-test-screen" style="display: none;">
        <div class="timer" id="timer-display">00:00</div>
        
        <div class="paragraph-display" id="paragraph-text">
            <!-- Paragraph content injected here -->
        </div>

        <p class="instruction">Type the above text below. Your typing is invisible!</p>
        
        <textarea class="blind-input" id="typing-area" spellcheck="false" autocomplete="off"></textarea>
    </div>

    <div class="container fade-in test-screen" id="result-screen" style="display: none;">
        <h1>Test Completed!</h1>
        <p>Your results have been submitted.</p>
        <div class="auth-box" id="my-results" style="margin: 0 auto; text-align: left;">
            <p><strong>WPM:</strong> <span id="res-wpm">0</span></p>
            <p><strong>Accuracy:</strong> <span id="res-acc">0%</span></p>
            <p><strong>Final Score:</strong> <span id="res-score">0</span></p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
