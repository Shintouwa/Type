<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Blind Typing</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container" id="login-container">
        <h1>Admin Login</h1>
        <div class="auth-box" style="margin: 0 auto;">
            <input type="text" id="admin-user" placeholder="Username">
            <input type="password" id="admin-pass" placeholder="Password">
            <button onclick="adminLogin()">Login</button>
        </div>
    </div>

    <div class="container" id="dashboard-container" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Admin Dashboard</h1>
            <button class="danger" onclick="logout()">Logout</button>
        </div>

        <!-- Control Panel -->
        <div class="auth-box" style="max-width: 100%; margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap;">
            <div style="flex: 1;">
                <h3>Start New Test</h3>
                <select id="paragraph-select">
                    <option value="">Loading Paragraphs...</option>
                </select>
                <input type="number" id="test-duration" placeholder="Duration (seconds)" value="60">
                <button onclick="startTest()">START TEST</button>
                <button class="danger" onclick="forceEndTest()">FORCE END</button>
            </div>
            <div style="flex: 1;">
                <h3>Add Paragraph</h3>
                <input type="text" id="new-para-title" placeholder="Title">
                <textarea id="new-para-text" placeholder="Content..." rows="3"></textarea>
                <button onclick="addParagraph()">Save Paragraph</button>
            </div>
        </div>

        <!-- Live Results -->
        <h2>Live Results</h2>
        <button onclick="fetchResults()">Refresh Table</button>
        <button onclick="exportCSV()">Export CSV</button>
        
        <table id="results-table">
            <thead>
                <tr>
                    <th>Participant</th>
                    <th>WPM</th>
                    <th>Accuracy</th>
                    <th>Score</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody>
                <!-- Results injected here -->
            </tbody>
        </table>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
